<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: layout(~{::main})}">
        <main>
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="mb-4">
                            <h1 class="h3 mb-2">
                                <i class="fas fa-graduation-cap text-primary me-2"></i>
                                Mes Notes
                            </h1>
                            <p class="text-muted">Voici les notes que vos professeurs ont ajoutées à votre sujet.</p>
                        </div>

                        <!-- No Notes Message -->
                        <div th:if="${#lists.isEmpty(notes)}" class="text-center py-5">
                            <i class="fas fa-graduation-cap fa-4x text-muted mb-4"></i>
                            <h4 class="text-muted">Aucune note trouvée</h4>
                            <p class="text-muted">Vos professeurs n'ont pas encore ajouté de notes vous concernant.</p>
                        </div>

                        <!-- Notes List -->
                        <div th:if="${!#lists.isEmpty(notes)}" class="row">
                            <div th:each="note : ${notes}" class="col-12 mb-4">
                                <div class="card shadow-sm">
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-2 text-center mb-3 mb-md-0">
                                                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center" 
                                                     style="width: 60px; height: 60px;">
                                                    <i class="fas fa-chalkboard-teacher fa-lg"></i>
                                                </div>
                                            </div>
                                            <div class="col-md-10">
                                                <div class="d-flex justify-content-between align-items-start mb-2">
                                                    <div>
                                                        <h5 class="card-title mb-1" th:text="${note.professorName}"></h5>
                                                        <p class="text-muted mb-0">
                                                            <i class="fas fa-user-tie me-1"></i>Professeur
                                                            <span th:if="${note.courseName and note.niveauName}">
                                                                • <i class="fas fa-book me-1"></i>
                                                                <span th:text="${note.courseName + ' - ' + note.niveauName}"></span>
                                                            </span>
                                                        </p>
                                                    </div>
                                                    <span class="badge bg-primary">Note</span>
                                                </div>
                                                
                                                <div class="alert alert-light border-start border-primary border-4 mb-3">
                                                    <p class="mb-0" th:text="${note.noteContent}" style="white-space: pre-wrap;"></p>
                                                </div>
                                                
                                                <div class="border-top pt-2">
                                                    <small class="text-muted">
                                                        <i class="fas fa-calendar me-1"></i>
                                                        Ajoutée le <span th:text="${#temporals.format(note.dateCreated, 'dd/MM/yyyy à HH:mm')}"></span>
                                                        <span th:if="${note.dateUpdated != note.dateCreated}">
                                                            • <i class="fas fa-edit me-1"></i>
                                                            Modifiée le <span th:text="${#temporals.format(note.dateUpdated, 'dd/MM/yyyy à HH:mm')}"></span>
                                                        </span>
                                                    </small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
