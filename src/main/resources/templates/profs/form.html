<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Centre de Formation'">Formulaire Professeur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }

        .card {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        footer {
            margin-top: 40px;
            padding: 20px 0;
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 rounded">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap me-2"></i>Centre de Formation
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home"></i> Accueil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/students">
                            <i class="fas fa-users"></i> Étudiants
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/sessions">
                            <i class="fas fa-calendar-alt"></i> Séances
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/profs">
                            <i class="fas fa-chalkboard-teacher"></i> Professeurs
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Back Button -->
        <div class="mb-3">
            <a href="/profs" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Retour à la liste
            </a>
        </div>

        <!-- Form Card -->
        <div class="card">
            <div class="card-header bg-light">
                <h5 class="mb-0">
                    <i class="fas fa-chalkboard-teacher me-2"></i>
                    <span th:text="${pageTitle}">Formulaire Professeur</span>
                </h5>
            </div>
            <div class="card-body">
                <form th:action="${prof.id != null} ?
                                @{/profs/update/{id}(id=${prof.id})} :
                                @{/profs/save}" th:object="${prof}" method="post" novalidate>

                    <input type="hidden" th:field="*{id}">

                    <div class="row">
                        <!-- Matricule -->
                        <div class="col-md-6 mb-3">
                            <label for="matricule" class="form-label fw-semibold">
                                <i class="fas fa-id-card me-1"></i>Matricule
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="matricule" th:field="*{matricule}"
                                th:classappend="${#fields.hasErrors('matricule')} ? 'is-invalid' : ''"
                                placeholder="Ex: PROF2025001" required minlength="5" maxlength="20">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('matricule')}">
                                <span th:errors="*{matricule}"></span>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label fw-semibold">
                                <i class="fas fa-envelope me-1"></i>Email
                                <span class="text-danger">*</span>
                            </label>
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                placeholder="professeur@email.com" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}">
                                <span th:errors="*{email}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Nom -->
                        <div class="col-md-6 mb-3">
                            <label for="nom" class="form-label fw-semibold">
                                <i class="fas fa-user me-1"></i>Nom
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="nom" th:field="*{nom}"
                                th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid' : ''" placeholder="Dupont"
                                required minlength="2" maxlength="50">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nom')}">
                                <span th:errors="*{nom}"></span>
                            </div>
                        </div>

                        <!-- Prénom -->
                        <div class="col-md-6 mb-3">
                            <label for="prenom" class="form-label fw-semibold">
                                <i class="fas fa-user me-1"></i>Prénom
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="prenom" th:field="*{prenom}"
                                th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid' : ''" placeholder="Jean"
                                required minlength="2" maxlength="50">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('prenom')}">
                                <span th:errors="*{prenom}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Spécialité -->
                        <div class="col-md-6 mb-3">
                            <label for="specialite" class="form-label fw-semibold">
                                <i class="fas fa-star me-1"></i>Spécialité
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="specialite" th:field="*{specialite}"
                                th:classappend="${#fields.hasErrors('specialite')} ? 'is-invalid' : ''"
                                placeholder="Ex: Mathématiques, Informatique" required minlength="2" maxlength="100">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('specialite')}">
                                <span th:errors="*{specialite}"></span>
                            </div>
                        </div>

                        <!-- Téléphone -->
                        <div class="col-md-6 mb-3">
                            <label for="telephone" class="form-label fw-semibold">
                                <i class="fas fa-phone me-1"></i>Téléphone
                            </label>
                            <input type="tel" class="form-control" id="telephone" th:field="*{telephone}"
                                placeholder="06 12 34 56 78">
                        </div>
                    </div>

                    <div class="row">
                        <!-- Date d'embauche -->
                        <div class="col-md-6 mb-4">
                            <label for="dateEmbauche" class="form-label fw-semibold">
                                <i class="fas fa-calendar-alt me-1"></i>Date d'embauche
                            </label>
                            <input type="date" class="form-control" id="dateEmbauche" th:field="*{dateEmbauche}"
                                th:classappend="${#fields.hasErrors('dateEmbauche')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dateEmbauche')}">
                                <span th:errors="*{dateEmbauche}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                        <div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>
                                <span th:text="${prof.id != null} ? 'Mettre à jour' : 'Enregistrer'">
                                    Enregistrer
                                </span>
                            </button>
                            <button type="reset" class="btn btn-outline-secondary ms-2">
                                <i class="fas fa-redo me-1"></i> Réinitialiser
                            </button>
                        </div>
                        <a href="/profs" class="btn btn-outline-danger">
                            <i class="fas fa-times me-1"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <p class="text-muted mb-0">
                        <i class="fas fa-code me-1"></i>
                        Développé avec Spring Boot 3, Thymeleaf & MySQL
                        |
                        <i class="fas fa-copyright me-1"></i>
                        2025 Centre de Formation
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Set today's date as default if date is empty
            const dateInput = document.getElementById('dateEmbauche');
            if (dateInput && !dateInput.value) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
            }

            // Form validation
            const form = document.querySelector('form');
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    </script>
</body>

</html>
