<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Centre de Formation'">Formulaire Niveau</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Navigation Bar (same as in list.html) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 rounded">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap me-2"></i>Centre de Formation
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home"></i> Accueil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/students">
                            <i class="fas fa-users"></i> Étudiants
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/sessions">
                            <i class="fas fa-calendar-alt"></i> Séances
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/niveaux">
                            <i class="fas fa-layer-group"></i> Niveaux
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Back Button -->
        <div class="mb-3">
            <a href="/niveaux" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Retour à la liste
            </a>
        </div>

        <!-- Form Card -->
        <div class="card">
            <div class="card-header bg-light">
                <h5 class="mb-0">
                    <i class="fas fa-layer-group me-2"></i>
                    <span th:text="${pageTitle}">Formulaire Niveau</span>
                </h5>
            </div>
            <div class="card-body">
                <form th:action="${niveau.id != null} ?
                                @{/niveaux/update/{id}(id=${niveau.id})} :
                                @{/niveaux/save}" th:object="${niveau}" method="post" novalidate>

                    <input type="hidden" th:field="*{id}">

                    <div class="row">
                        <!-- Code -->
                        <div class="col-md-6 mb-3">
                            <label for="code" class="form-label fw-semibold">
                                <i class="fas fa-hashtag me-1"></i>Code
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="code" th:field="*{code}"
                                th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : ''"
                                placeholder="Ex: NIV001" required minlength="2" maxlength="10">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}">
                                <span th:errors="*{code}"></span>
                            </div>
                        </div>

                        <!-- Nom -->
                        <div class="col-md-6 mb-3">
                            <label for="nom" class="form-label fw-semibold">
                                <i class="fas fa-tag me-1"></i>Nom
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="nom" th:field="*{nom}"
                                th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid' : ''"
                                placeholder="Ex: Débutant, Intermédiaire, Avancé" required minlength="2" maxlength="50">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nom')}">
                                <span th:errors="*{nom}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">
                            <i class="fas fa-align-left me-1"></i>Description
                        </label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                            placeholder="Description du niveau..."></textarea>
                    </div>

                    <!-- Form Actions -->
                    <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                        <div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>
                                <span th:text="${niveau.id != null} ? 'Mettre à jour' : 'Enregistrer'">
                                    Enregistrer
                                </span>
                            </button>
                            <button type="reset" class="btn btn-outline-secondary ms-2">
                                <i class="fas fa-redo me-1"></i> Réinitialiser
                            </button>
                        </div>
                        <a href="/niveaux" class="btn btn-outline-danger">
                            <i class="fas fa-times me-1"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.querySelector('form');
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    </script>
</body>

</html>
