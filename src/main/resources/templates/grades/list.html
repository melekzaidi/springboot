<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: layout(~{::main})}">
        <main>
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">
                                    <i class="fas fa-graduation-cap me-2"></i>
                                    Gestion des Notes
                                </h3>
                            </div>
                            <div class="card-body">
                                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                                    <span th:text="${success}"></span>
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                    <span th:text="${error}"></span>
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>

                                <div class="row">
                                    <div th:each="assignment : ${assignments}" class="col-md-6 col-lg-4 mb-4">
                                        <div class="card h-100 shadow-sm">
                                            <div class="card-header bg-primary text-white">
                                                <h5 class="card-title mb-0">
                                                    <i class="fas fa-book me-2"></i>
                                                    <span th:text="${assignment.courseNiveau.course.nom}"></span>
                                                </h5>
                                                <small th:text="${assignment.courseNiveau.niveau.nom}"></small>
                                            </div>
                                            <div class="card-body">
                                                <p class="card-text">
                                                    <strong>Professeur:</strong> <span th:text="${assignment.prof.prenom + ' ' + assignment.prof.nom}"></span><br>
                                                    <strong>Niveau:</strong> <span th:text="${assignment.courseNiveau.niveau.nom}"></span>
                                                </p>
                                                <div class="d-grid">
                                                    <a th:href="@{/grades/by-prof-course-niveau/{id}(id=${assignment.id})}" 
                                                       class="btn btn-outline-primary">
                                                        <i class="fas fa-eye me-1"></i>
                                                        Voir les notes
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div th:if="${#lists.isEmpty(assignments)}" class="col-12">
                                        <div class="text-center py-5">
                                            <i class="fas fa-graduation-cap fa-3x text-muted mb-3"></i>
                                            <h4 class="text-muted">Aucune assignation trouvée</h4>
                                            <p class="text-muted">Vous n'avez pas encore d'assignations de cours.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
