<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Modifier la Note' : 'Nouvelle Note'">Nouvelle Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: layout(~{::main})}">
        <main>
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="card shadow">
                            <div class="card-header">
                                <h4 class="card-title mb-0">
                                    <i class="fas fa-graduation-cap text-primary me-2"></i>
                                    <span th:text="${isEdit} ? 'Modifier la Note' : 'Nouvelle Note'"></span>
                                </h4>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/grades/save}" th:object="${gradeDTO}" method="post">
                                    <input type="hidden" th:field="*{id}">
                                    <input type="hidden" th:field="*{profCourseNiveauId}">

                                    <!-- Course and Level Info -->
                                    <div th:if="${profCourseNiveau != null}" class="alert alert-info mb-4">
                                        <div class="row">
                                            <div class="col-md-4">
                                                <strong>Cours:</strong> <span th:text="${courseName}"></span>
                                            </div>
                                            <div class="col-md-4">
                                                <strong>Niveau:</strong> <span th:text="${niveauName}"></span>
                                            </div>
                                            <div class="col-md-4">
                                                <strong>Professeur:</strong> <span th:text="${profName}"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Student Selection -->
                                    <div class="mb-3">
                                        <label for="studentId" class="form-label">
                                            <i class="fas fa-user me-1"></i>Étudiant *
                                        </label>
                                        <select class="form-select" th:field="*{studentId}" id="studentId" required>
                                            <option value="">Sélectionner un étudiant</option>
                                            <option th:each="student : ${students}" 
                                                    th:value="${student.id}" 
                                                    th:text="${student.prenom + ' ' + student.nom + ' (' + student.matricule + ')'}">
                                            </option>
                                        </select>
                                        <div th:if="${#fields.hasErrors('studentId')}" class="invalid-feedback d-block">
                                            <span th:errors="*{studentId}"></span>
                                        </div>
                                    </div>

                                    <!-- Grade Type -->
                                    <div class="mb-3">
                                        <label for="gradeType" class="form-label">
                                            <i class="fas fa-clipboard-list me-1"></i>Type de Note *
                                        </label>
                                        <select class="form-select" th:field="*{gradeType}" id="gradeType" required>
                                            <option value="">Sélectionner le type</option>
                                            <option th:each="type : ${gradeTypes}" 
                                                    th:value="${type}" 
                                                    th:text="${type.displayName}">
                                            </option>
                                        </select>
                                        <div th:if="${#fields.hasErrors('gradeType')}" class="invalid-feedback d-block">
                                            <span th:errors="*{gradeType}"></span>
                                        </div>
                                    </div>

                                    <!-- Grade Value -->
                                    <div class="mb-3">
                                        <label for="note" class="form-label">
                                            <i class="fas fa-star me-1"></i>Note (sur 20) *
                                        </label>
                                        <input type="number" 
                                               class="form-control" 
                                               th:field="*{note}" 
                                               id="note" 
                                               min="0" 
                                               max="20" 
                                               step="0.25" 
                                               required
                                               placeholder="Ex: 15.5">
                                        <div th:if="${#fields.hasErrors('note')}" class="invalid-feedback d-block">
                                            <span th:errors="*{note}"></span>
                                        </div>
                                        <div class="form-text">Note sur 20 (décimales autorisées)</div>
                                    </div>

                                    <!-- Date Evaluation -->
                                    <div class="mb-3">
                                        <label for="dateEvaluation" class="form-label">
                                            <i class="fas fa-calendar me-1"></i>Date d'évaluation *
                                        </label>
                                        <input type="date" 
                                               class="form-control" 
                                               th:field="*{dateEvaluation}" 
                                               id="dateEvaluation" 
                                               required>
                                        <div th:if="${#fields.hasErrors('dateEvaluation')}" class="invalid-feedback d-block">
                                            <span th:errors="*{dateEvaluation}"></span>
                                        </div>
                                    </div>

                                    <!-- Coefficient -->
                                    <div class="mb-3">
                                        <label for="coefficient" class="form-label">
                                            <i class="fas fa-weight me-1"></i>Coefficient
                                        </label>
                                        <input type="number" 
                                               class="form-control" 
                                               th:field="*{coefficient}" 
                                               id="coefficient" 
                                               min="0.1" 
                                               max="5" 
                                               step="0.1" 
                                               placeholder="Ex: 1.0">
                                        <div th:if="${#fields.hasErrors('coefficient')}" class="invalid-feedback d-block">
                                            <span th:errors="*{coefficient}"></span>
                                        </div>
                                        <div class="form-text">Coefficient automatique selon le type (DS: 0.3, Examen: 0.7)</div>
                                    </div>

                                    <!-- Comments -->
                                    <div class="mb-4">
                                        <label for="commentaire" class="form-label">
                                            <i class="fas fa-comment me-1"></i>Commentaire
                                        </label>
                                        <textarea class="form-control" 
                                                  th:field="*{commentaire}" 
                                                  id="commentaire" 
                                                  rows="3"
                                                  placeholder="Commentaire optionnel sur cette note..."></textarea>
                                        <div th:if="${#fields.hasErrors('commentaire')}" class="invalid-feedback d-block">
                                            <span th:errors="*{commentaire}"></span>
                                        </div>
                                    </div>

                                    <!-- Action Buttons -->
                                    <div class="d-flex justify-content-between">
                                        <a href="/grades" class="btn btn-secondary">
                                            <i class="fas fa-arrow-left me-1"></i>Retour
                                        </a>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-save me-1"></i>
                                            <span th:text="${isEdit} ? 'Modifier' : 'Enregistrer'}"></span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-set coefficient based on grade type
        document.getElementById('gradeType').addEventListener('change', function() {
            const coefficientField = document.getElementById('coefficient');
            const selectedType = this.value;
            
            if (selectedType === 'DS') {
                coefficientField.value = '0.3';
            } else if (selectedType === 'EXAMEN') {
                coefficientField.value = '0.7';
            }
        });
    </script>
</body>
</html>
