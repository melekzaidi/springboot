<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Centre de Formation'">Formulaire Séance</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card-header {
            border-radius: 10px 10px 0 0 !important;
            font-weight: 600;
        }

        footer {
            margin-top: 40px;
            padding: 20px 0;
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 rounded">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap me-2"></i>Centre de Formation
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="/students"><i class="fas fa-users"></i> Étudiants</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/sessions"><i class="fas fa-calendar-alt"></i>
                            Séances</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Flash Messages -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Back Button -->
        <div class="mb-3">
            <a href="/sessions" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Retour à la liste
            </a>
        </div>

        <div class="card">
            <div class="card-header bg-light">
                <h5 class="mb-0">
                    <i class="fas fa-calendar-plus me-2"></i>
                    <span th:text="${pageTitle}">Formulaire Séance</span>
                </h5>
            </div>
            <div class="card-body">
                <form
                    th:action="${courseSession.id != null} ? @{/sessions/update/{id}(id=${courseSession.id})} : @{/sessions/save}"
                    th:object="${courseSession}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="profCourseNiveau" class="form-label fw-semibold">Cours et Niveau <span
                                class="text-danger">*</span></label>
                        <select class="form-select" id="profCourseNiveau" th:field="*{profCourseNiveau.id}" required>
                            <option value="" disabled selected>Choisir un cours...</option>
                            <option th:each="assignment : ${assignments}" th:value="${assignment.id}"
                                th:text="${assignment.prof.nomComplet + ' - ' + assignment.courseNiveau.course.nom + ' (' + assignment.courseNiveau.niveau.nom + ')'}">
                                Prof - Mathématiques - Niveau 1
                            </option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('profCourseNiveau')}"
                            th:errors="*{profCourseNiveau}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="startDateTime" class="form-label fw-semibold">Date et Heure de début <span
                                    class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" id="startDateTime"
                                th:field="*{startDateTime}" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('startDateTime')}"
                                th:errors="*{startDateTime}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="endDateTime" class="form-label fw-semibold">Date et Heure de fin <span
                                    class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" id="endDateTime" th:field="*{endDateTime}"
                                required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('endDateTime')}"
                                th:errors="*{endDateTime}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                            placeholder="Détails de la séance (optionnel)"></textarea>
                    </div>

                    <div class="d-flex justify-content-between border-top pt-3 mt-3">
                        <div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Enregistrer
                            </button>
                        </div>
                        <a href="/sessions" class="btn btn-outline-danger">
                            <i class="fas fa-times me-1"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
