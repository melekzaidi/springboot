<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${noteDTO.id != null ? 'Modifier la Remarque' : 'Ajouter une Remarque'} + ' - Centre de Formation'">Ajouter une Remarque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 rounded">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap me-2"></i>Centre de Formation
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="/professor-notes">
                    <i class="fas fa-comment-dots me-1"></i>Remarques Étudiants
                </a>
                <a class="nav-link text-white" href="/calendar">
                    <i class="fas fa-calendar me-1"></i>Calendrier
                </a>
                <a class="nav-link text-white" href="/logout">
                    <i class="fas fa-sign-out-alt me-1"></i>Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header">
                        <h4 class="card-title mb-0">
                            <i class="fas fa-comment-dots text-primary me-2"></i>
                            <span th:text="${noteDTO.id != null ? 'Modifier la Remarque' : 'Ajouter une Remarque'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/professor-notes/save}" th:object="${noteDTO}" method="post">
                            <input type="hidden" th:field="*{id}">
                            <input type="hidden" th:field="*{professorId}" th:value="${professorId}">

                            <!-- Student Selection -->
                            <div class="mb-3">
                                <label for="studentId" class="form-label">
                                    <i class="fas fa-user me-1"></i>Étudiant *
                                </label>
                                <select class="form-select" th:field="*{studentId}" id="studentId" required>
                                    <option value="">Sélectionner un étudiant</option>
                                    <option th:each="student : ${students}" 
                                            th:value="${student.id}" 
                                            th:text="${student.prenom + ' ' + student.nom + ' (' + student.matricule + ')'}">
                                    </option>
                                </select>
                                <div th:if="${#fields.hasErrors('studentId')}" class="invalid-feedback d-block">
                                    <span th:errors="*{studentId}"></span>
                                </div>
                            </div>

                            <!-- Note Content -->
                            <div class="mb-3">
                                <label for="noteContent" class="form-label">
                                    <i class="fas fa-comment me-1"></i>Contenu de la remarque *
                                </label>
                                <textarea class="form-control" 
                                          th:field="*{noteContent}" 
                                          id="noteContent" 
                                          rows="6" 
                                          required
                                          placeholder="Saisissez votre remarque sur cet étudiant..."></textarea>
                                <div th:if="${#fields.hasErrors('noteContent')}" class="invalid-feedback d-block">
                                    <span th:errors="*{noteContent}"></span>
                                </div>
                                <div class="form-text">Maximum 2000 caractères</div>
                            </div>

                            <!-- Visibility Toggle -->
                            <div class="mb-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" 
                                           type="checkbox" 
                                           th:field="*{visibleToStudent}" 
                                           id="visibleToStudent">
                                    <label class="form-check-label" for="visibleToStudent">
                                        <i class="fas fa-eye me-1"></i>
                                        Visible par l'étudiant
                                    </label>
                                </div>
                                <div class="form-text">
                                    Si désactivé, cette remarque ne sera visible que par vous et les administrateurs
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex justify-content-between">
                                <a href="/professor-notes" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-1"></i>Retour
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>
                                    <span th:text="${noteDTO.id != null ? 'Modifier' : 'Ajouter'}"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-5 py-3 bg-light">
        <div class="container text-center">
            <p class="text-muted mb-0">
                <i class="fas fa-copyright me-1"></i>
                2026 Centre de Formation - Tous droits réservés
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
