<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${noteDTO.id != null ? 'Modifier la Note' : 'Ajouter une Note'}">Ajouter une Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: layout(~{::main})}">
        <main>
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        <div class="card shadow">
                            <div class="card-header">
                                <h4 class="card-title mb-0">
                                    <i class="fas fa-sticky-note text-primary me-2"></i>
                                    <span th:text="${noteDTO.id != null ? 'Modifier la Note' : 'Ajouter une Note'}"></span>
                                </h4>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/professor-notes/save}" th:object="${noteDTO}" method="post">
                                    <input type="hidden" th:field="*{id}">
                                    <input type="hidden" th:field="*{professorId}" th:value="${professorId}">

                                    <!-- Student Selection -->
                                    <div class="mb-3">
                                        <label for="studentId" class="form-label">
                                            <i class="fas fa-user me-1"></i>Étudiant *
                                        </label>
                                        <select class="form-select" th:field="*{studentId}" id="studentId" required>
                                            <option value="">Sélectionner un étudiant</option>
                                            <option th:each="student : ${students}" 
                                                    th:value="${student.id}" 
                                                    th:text="${student.prenom + ' ' + student.nom + ' (' + student.matricule + ')'}">
                                            </option>
                                        </select>
                                        <div th:if="${#fields.hasErrors('studentId')}" class="invalid-feedback d-block">
                                            <span th:errors="*{studentId}"></span>
                                        </div>
                                    </div>

                                    <!-- Note Content -->
                                    <div class="mb-3">
                                        <label for="noteContent" class="form-label">
                                            <i class="fas fa-comment me-1"></i>Contenu de la note *
                                        </label>
                                        <textarea class="form-control" 
                                                  th:field="*{noteContent}" 
                                                  id="noteContent" 
                                                  rows="6" 
                                                  required
                                                  placeholder="Saisissez votre note sur cet étudiant..."></textarea>
                                        <div th:if="${#fields.hasErrors('noteContent')}" class="invalid-feedback d-block">
                                            <span th:errors="*{noteContent}"></span>
                                        </div>
                                        <div class="form-text">Maximum 2000 caractères</div>
                                    </div>

                                    <!-- Visibility Toggle -->
                                    <div class="mb-4">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" 
                                                   type="checkbox" 
                                                   th:field="*{visibleToStudent}" 
                                                   id="visibleToStudent">
                                            <label class="form-check-label" for="visibleToStudent">
                                                <i class="fas fa-eye me-1"></i>
                                                Visible par l'étudiant
                                            </label>
                                        </div>
                                        <div class="form-text">
                                            Si désactivé, cette note ne sera visible que par vous et les administrateurs
                                        </div>
                                    </div>

                                    <!-- Action Buttons -->
                                    <div class="d-flex justify-content-between">
                                        <a href="/professor-notes" class="btn btn-secondary">
                                            <i class="fas fa-arrow-left me-1"></i>Retour
                                        </a>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-save me-1"></i>
                                            <span th:text="${noteDTO.id != null ? 'Modifier' : 'Ajouter'}"></span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
