<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Notes sur les Étudiants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: layout(~{::main})}">
        <main>
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h1 class="h3 mb-0">
                                <i class="fas fa-sticky-note text-primary me-2"></i>
                                Mes Notes sur les Étudiants
                            </h1>
                            <a href="/professor-notes/form" class="btn btn-primary">
                                <i class="fas fa-plus me-1"></i>
                                Ajouter une Note
                            </a>
                        </div>

                        <!-- Success/Error Messages -->
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Notes List -->
                        <div th:if="${#lists.isEmpty(notes)}" class="text-center py-5">
                            <i class="fas fa-sticky-note fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">Aucune note trouvée</h4>
                            <p class="text-muted">Commencez par ajouter une note sur un étudiant</p>
                            <a href="/professor-notes/form" class="btn btn-primary">
                                <i class="fas fa-plus me-1"></i>
                                Ajouter votre première note
                            </a>
                        </div>

                        <div th:if="${!#lists.isEmpty(notes)}" class="row">
                            <div th:each="note : ${notes}" class="col-md-6 col-lg-4 mb-4">
                                <div class="card h-100 shadow-sm">
                                    <div class="card-header d-flex justify-content-between align-items-center">
                                        <h6 class="card-title mb-0">
                                            <i class="fas fa-user me-1"></i>
                                            <span th:text="${note.studentName}"></span>
                                        </h6>
                                        <span th:if="${note.visibleToStudent}" class="badge bg-success">
                                            <i class="fas fa-eye me-1"></i>Visible
                                        </span>
                                        <span th:unless="${note.visibleToStudent}" class="badge bg-secondary">
                                            <i class="fas fa-eye-slash me-1"></i>Masquée
                                        </span>
                                    </div>
                                    <div class="card-body">
                                        <div th:if="${note.courseName and note.niveauName}" class="mb-2">
                                            <small class="text-muted">
                                                <i class="fas fa-book me-1"></i>
                                                <span th:text="${note.courseName + ' - ' + note.niveauName}"></span>
                                            </small>
                                        </div>
                                        <div th:unless="${note.courseName and note.niveauName}" class="mb-2">
                                            <small class="text-muted">
                                                <i class="fas fa-comment me-1"></i>
                                                Note générale
                                            </small>
                                        </div>
                                        <p class="card-text" th:text="${#strings.abbreviate(note.noteContent, 150)}"></p>
                                        <small class="text-muted">
                                            <i class="fas fa-calendar me-1"></i>
                                            Créée le <span th:text="${#temporals.format(note.dateCreated, 'dd/MM/yyyy HH:mm')}"></span>
                                            <span th:if="${note.dateUpdated != note.dateCreated}">
                                                <br><i class="fas fa-edit me-1"></i>
                                                Modifiée le <span th:text="${#temporals.format(note.dateUpdated, 'dd/MM/yyyy HH:mm')}"></span>
                                            </span>
                                        </small>
                                    </div>
                                    <div class="card-footer bg-transparent">
                                        <div class="btn-group w-100" role="group">
                                            <a th:href="@{/professor-notes/edit/{id}(id=${note.id})}" 
                                               class="btn btn-outline-primary btn-sm">
                                                <i class="fas fa-edit me-1"></i>Modifier
                                            </a>
                                            <form th:action="@{/professor-notes/delete/{id}(id=${note.id})}" 
                                                  method="post" 
                                                  class="d-inline"
                                                  onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer cette note ?')">
                                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                                    <i class="fas fa-trash me-1"></i>Supprimer
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
