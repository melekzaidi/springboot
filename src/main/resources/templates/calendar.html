<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Calendrier - Gestion des Cours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        .session-card {
            transition: transform 0.2s;
            cursor: pointer;
        }

        .session-card:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Gestion des Cours</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home"></i> Accueil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/students">
                            <i class="fas fa-users"></i> Étudiants
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/sessions">
                            <i class="fas fa-calendar-alt"></i> Séances
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="navbar-text text-white me-3">
                        <i class="bi bi-person-circle"></i>
                        <span th:text="${session.user.prenom + ' ' + session.user.nom}">Utilisateur</span>
                        <span class="badge bg-light text-primary"
                            th:text="${userRole == 'prof' ? 'Professeur' : 'Étudiant'}">Rôle</span>
                    </span>
                    <a href="/logout" class="btn btn-outline-light btn-sm">Déconnexion</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Mon Planning</h2>
        </div>

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${sessions == null or sessions.empty}" class="alert alert-info">
            Aucune séance prévue pour le moment.
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="courseSession : ${sessions}">
                <div class="card h-100 session-card">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center"
                        style="cursor: pointer;"
                        th:onclick="'window.location.href=\'/session/' + ${courseSession.id} + '\''">
                        <span class="fw-bold"
                            th:text="${#temporals.format(courseSession.startDateTime, 'EEEE d MMMM')}">Lundi
                            1 Janvier</span>
                        <span class="badge bg-primary"
                            th:text="${#temporals.format(courseSession.startDateTime, 'HH:mm') + ' - ' + #temporals.format(courseSession.endDateTime, 'HH:mm')}">09:00
                            - 12:00</span>
                    </div>
                    <div class="card-body" style="cursor: pointer;"
                        th:onclick="'window.location.href=\'/session/' + ${courseSession.id} + '\''">
                        <h5 class="card-title" th:text="${courseSession.profCourseNiveau.courseNiveau.course.nom}">Nom
                            du
                            Cours</h5>
                        <h6 class="card-subtitle mb-2 text-muted"
                            th:text="${courseSession.profCourseNiveau.courseNiveau.niveau.nom}">Niveau</h6>
                        <p class="card-text text-truncate" th:text="${courseSession.description}">Description de la
                            séance.
                        </p>

                        <div th:if="${userRole == 'student'}" class="mt-2">
                            <small class="text-muted">Professeur: <span
                                    th:text="${courseSession.profCourseNiveau.prof.nomComplet}">Nom Prof</span></small>
                        </div>
                    </div>
                    <div th:if="${userRole == 'prof'}"
                        class="card-footer bg-transparent border-top-0 d-flex justify-content-between">
                        <a th:href="@{/session/{id}(id=${courseSession.id})}" class="btn btn-sm btn-outline-primary"
                            title="Voir les détails / Présences">
                            <i class="bi bi-people"></i> Présences
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
