<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Centre de Formation'">Centre de Formation</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }
        .card {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card-header {
            border-radius: 10px 10px 0 0 !important;
            font-weight: 600;
        }
        .btn-action {
            padding: 5px 10px;
            margin: 0 2px;
        }
        .badge {
            font-size: 0.8em;
            padding: 5px 10px;
        }
        .alert {
            border-radius: 8px;
        }
        footer {
            margin-top: 40px;
            padding: 20px 0;
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 rounded">
    <div class="container">
        <a class="navbar-brand" th:href="@{/static}">
            <i class="fas fa-graduation-cap me-2"></i>Centre de Formation
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/static}">
                        <i class="fas fa-home"></i> Accueil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/students}">
                        <i class="fas fa-users"></i> Étudiants
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" href="#">
                        <i class="fas fa-chalkboard-teacher"></i> Formateurs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" href="#">
                        <i class="fas fa-book"></i> Cours
                    </a>
                </li>
            </ul>
            <form class="d-flex" th:action="@{/students}" method="get" th:unless="${#request.requestURI.contains('home')}">
                <input class="form-control me-2" type="search" name="keyword"
                       placeholder="Rechercher un étudiant..." th:value="${keyword}">
                <button class="btn btn-outline-light" type="submit">
                    <i class="fas fa-search"></i>
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container">
    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${pageTitle}">Page Title</h2>
        <div th:if="${#strings.contains(pageTitle, 'Liste') or #strings.contains(pageTitle, 'Gestion')}">
            <a th:href="@{/students/new}" class="btn btn-success">
                <i class="fas fa-plus"></i> Ajouter un étudiant
            </a>
        </div>
    </div>

    <!-- Content will be inserted here -->
    <div th:insert="~{${content}}"></div>
</div>

<!-- Footer -->
<footer class="mt-5">
    <div class="container">
        <div class="row">
            <div class="col-md-12 text-center">
                <p class="text-muted mb-0">
                    <i class="fas fa-code me-1"></i>
                    Développé avec Spring Boot 3, Thymeleaf & MySQL
                    |
                    <i class="fas fa-copyright me-1"></i>
                    2025 Centre de Formation
                </p>
            </div>
        </div>
    </div>
</footer>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Scripts will be inserted here -->
<div th:insert="~{${scripts}}"></div>
</body>
</html>
